# Builds the site and publishes it to GitHub Pages.
# Runs on every push to main, by hand from the Actions tab, and every three hours so the news stays current.
# One-time setup: repository Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # A failed news fetch must never stop the site from deploying, hence continue-on-error.
      - name: Fetch the latest news
        run: |
          pip install requests
          python -m pipeline.news
        continue-on-error: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and build
        working-directory: web
        run: |
          npm ci || npm install --no-audit --no-fund
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
